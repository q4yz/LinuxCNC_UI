<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon-192x192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>frontend</title>

  <body>
    <div id="app"></div>
    <!-- Teleport target for the shared 3D toolpath viewer (see
         App.vue) while it's parked off the dashboard/jogging routes.
         Must live outside the Vue-mounted tree: Vue mounts an
         app's whole subtree in one pass, so a target declared
         inside App.vue's own template does not exist in the live
         document yet at the moment a Teleport inside that same
         pass tries to resolve it. -->
    <div id="toolpath-parking" style="display: none"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
