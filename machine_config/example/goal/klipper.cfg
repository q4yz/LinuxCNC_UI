[mcu]

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 5
max_z_accel: 100

[stepper_x]
step_pin: PF11
dir_pin: PG3
enable_pin: !PG5
microsteps: 16
rotation_distance: 40
endstop_pin: PG6
position_endstop: 0
position_max: 200 # Adjust to your bed size
homing_speed: 50

[tmc2209 stepper_x]
uart_pin: PC6
run_current: 0.800
stealthchop_threshold: 999999

[stepper_y]
step_pin: PG4
dir_pin: PC1
enable_pin: !PA0
microsteps: 16
rotation_distance: 40
endstop_pin: PG9
position_endstop: 0
position_max: 200 # Adjust to your bed size
homing_speed: 50

[tmc2209 stepper_y]
uart_pin: PC7
run_current: 0.800
stealthchop_threshold: 999999

[stepper_z]
step_pin: PF9
dir_pin: PF10
enable_pin: !PG2
microsteps: 16
rotation_distance: 8
endstop_pin: PG10 # If using BLTouch for Z homing, change this to probe:z_virtual_endstop
position_endstop: 0
position_max: 200 # Adjust to your Z height
homing_speed: 10

[tmc2209 stepper_z]
uart_pin: PF2
run_current: 0.800
stealthchop_threshold: 999999

[extruder]
step_pin: PC13
dir_pin: PF0
enable_pin: !PF1
microsteps: 16
rotation_distance: 33.500
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PA2
sensor_type: Generic 3950
sensor_pin: PF4
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
min_temp: 0
max_temp: 250

[heater_bed]
heater_pin: PA1
sensor_type: Generic 3950
sensor_pin: PF3
control: watermark
min_temp: 0
max_temp: 130

[fan]
pin: PA8