name: CI Pipeline

# Run this workflow on pushes and pull requests to the main branch
on:
  push:
    branches: [ "main" , "ai_dev"]
  pull_request:
    branches: [ "main", "ai_dev" ]

jobs:
  # ----------------------------------------
  # FRONTEND JOB (Vue, Vite, Node)
  # ----------------------------------------
  frontend:
    name: Build Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # 1. Set up Node
      # Node 22.6+ is required for --experimental-strip-types, which
      # `npm run test` passes to run the .ts test files directly (see
      # frontend/package.json's "test" script). Node 20 doesn't
      # recognize the flag at all and exits with "bad option".
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      # 2. Set up Python (Needed to boot the backends)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: ./backend/requirements*.txt

      # 3. Install ALL Dependencies
      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-system.txt -r requirements-machine.txt

      # 4. Boot backends in the background and generate API
      - name: Generate API Client
        run: |
          # Start Machine Backend
          cd backend/machine
          uvicorn main:app --port 8000 &
          
          # Start System Backend
          cd ../system
          uvicorn main:app --port 8001 &
          
          # Wait for them to be ready
          sleep 5 
          
          # Generate the client
          cd ../../frontend
          npm run generate-api

      # 5. Finally, build
      - name: Vue Type Check
        working-directory: ./frontend
        run: npm run typecheck

      - name: Run Frontend Tests
        working-directory: ./frontend
        run: npm run test

      - name: Build Vite App
        working-directory: ./frontend
        run: npm run build


  # ----------------------------------------
  # BACKEND JOB (FastAPI, Python)
  # ----------------------------------------
  backend:
    name: Test Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13' # Matching your traceback
          cache: 'pip'
          cache-dependency-path: ./backend/requirements*.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # Install both backend dependencies
          pip install -r requirements-system.txt -r requirements-machine.txt
          
          # Install testing and linting tools
          pip install pytest ruff mypy

      # Addresses your HANDOFF.md gap: "no mypy/ruff at all"
      # (Remove the '|| true' once you fix the initial errors to make the pipeline strict)
      - name: Lint with Ruff
        run: ruff check . || true

      - name: Type Check with Mypy
        run: mypy .

      - name: Run Machine Tests
        working-directory: ./backend/machine
        run: pytest tests/

      - name: Run System Tests
        working-directory: ./backend/system
        run: pytest tests/

      - name: Run Common Tests
        working-directory: ./backend/common
        run: pytest tests/