# Demo image's nginx site: the HTTP half of scripts/configure_nginx.sh
# (no mkcert/HTTPS here — put a TLS reverse proxy in front if needed).
# The routes are the very same tracked file a real installation uses.
server {
    listen 80 default_server;
    server_name _;

    root /app/frontend/dist;
    index index.html;

    client_max_body_size 100M;

    # Same routes as a real installation — one tracked file.
    include /app/deploy/nginx/linuxcnc-ui-routes.conf;
}
