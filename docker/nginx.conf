# Adapted from install.sh's real Pi deployment config (the HTTP
# server block — this demo image skips install.sh's mkcert/HTTPS
# setup entirely; put a real reverse proxy with TLS in front of this
# container if the demo needs to be reachable over HTTPS). Routing
# split mirrors frontend/vite.config.mjs's dev-mode proxy table
# exactly — see that file's own comment for why the macro-start regex
# and the :8001 (system service) prefixes have to come before the
# generic /api fallback to :8000 (machine backend).
server {
    listen 80 default_server;
    server_name _;

    root /app/frontend/dist;
    index index.html;

    client_max_body_size 100M;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # nginx checks regex (~) locations in declaration order regardless
    # of which plain prefix location below would otherwise be the
    # "longest match" — so this only has to appear anywhere before the
    # generic /api/v1/modules/macros block has a chance to swallow it,
    # not literally first. Kept first anyway to mirror install.sh.
    location ~ ^/api/v1/modules/macros/[^/]+/start$ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/v1/system {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /api/v1/programs {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /api/v1/modules/machineconfig {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /api/v1/modules/macros {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /api {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /ws {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }
}
