# Read the Docs build: https://docs.readthedocs.io/en/stable/config-file/v2.html
# Import the repository once on readthedocs.org; every push to a branch or
# tag it tracks then builds that version ("latest" = the default branch).
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true

python:
  install:
    - requirements: docs/requirements.txt
