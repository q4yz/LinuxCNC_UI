# LinuxCNC UI — request routing, included by every nginx server block
# (scripts/configure_nginx.sh writes /etc/nginx/sites-available/linuxcnc-ui
# with `include <repo>/deploy/nginx/linuxcnc-ui-routes.conf;`, the Docker
# image includes the same file).
#
# Tracked in git on purpose: an update's `git pull` + `systemctl reload
# nginx` applies new routes, so a new system-service endpoint can never
# 404 on an updated machine again. Keep it in sync with the dev proxy in
# frontend/vite.config.mjs — backend/system/tests/test_nginx_routes.py
# checks every backend route against this file.
#
#   :8001  system service  — always up (settings, programs, machine
#          config, macro files, version/update, machine lifecycle)
#   :8000  machine backend — runs with the LinuxCNC session
#
# nginx picks the longest matching prefix, but checks regex (~)
# locations first-match in declaration order before using it — so the
# macro-start regex below wins over the /api/v1/modules/macros prefix.

location / {
    try_files $uri $uri/ /index.html;
}

# Macro *execution* needs LinuxCNC (machine backend); macro files are
# system-service CRUD (prefix below).
location ~ ^/api/v1/modules/macros/[^/]+/start$ {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}

# --- system service (:8001) -------------------------------------------- #
location /api/v1/system {
    proxy_pass http://127.0.0.1:8001;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}
location /api/v1/settings {
    proxy_pass http://127.0.0.1:8001;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}
location /api/v1/programs {
    proxy_pass http://127.0.0.1:8001;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}
location /api/v1/modules/machineconfig {
    proxy_pass http://127.0.0.1:8001;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}
location /api/v1/modules/macros {
    proxy_pass http://127.0.0.1:8001;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}

# --- machine backend (:8000) — everything else under /api, plus WS ------ #
location /api {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}
location /ws {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_set_header Host $host;
}
