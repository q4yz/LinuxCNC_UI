[mypy]
python_version = 3.12
mypy_path = backend/common
namespace_packages = True
explicit_package_bases = True
ignore_missing_imports = True

; Enforces the AGENT.md "no bare dict in Python" rule: a bare
; `dict`, `list`, `set`, `tuple`, or `type` without a type parameter
; is flagged the same as `Any`. This is deliberately narrower than
; mypy's full `--strict` (which would surface hundreds of unrelated
; pre-existing issues) — see .agent/HANDOFF.md for the scope note.
disallow_any_generics = True
warn_redundant_casts = True
warn_unused_ignores = True

; Everything below this line is pre-existing type debt that predates
; this config (return-type mismatches, HalPin subclass override
; signatures, Literal/str arg mismatches, etc.) — genuine bugs in
; some cases, but each needs individual review rather than a blind
; fix, and none of them are the bare-dict/any violations this config
; exists to catch. Disabled here so the gate can be blocking on the
; rule it was added for; see .agent/HANDOFF.md § 2 for the itemized
; list and re-enable each code as its backlog is cleared.
disable_error_code =
    return-value,
    arg-type,
    override,
    assignment,
    call-arg,
    attr-defined,
