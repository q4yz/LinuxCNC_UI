[mcu]
connection: remora-spi
board: BIGTREETECH MANTA M8P V1.0 / V1.1
PRU_base_freq: 20000

[mcu sb2009]
connection: remora-can
canbus_uuid: 0123456789ab

[machine]
kinematics: corexy
max_velocity: 300
max_accel: 3000
max_z_velocity: 15
max_z_accel: 350

[estop]

[stepper_x]
step_pin: PF13
dir_pin: PF12
enable_pin: !PF14
rotation_distance: 40
microsteps: 16
position_endstop: 250
position_max: 250

[stepper_y]
step_pin: PG0
dir_pin: PG1
enable_pin: !PF15
rotation_distance: 40
microsteps: 16
position_endstop: 250
position_max: 250

[stepper_z]
step_pin: PF11
dir_pin: PG3
enable_pin: !PG5
rotation_distance: 8
microsteps: 16
position_endstop: 0
position_max: 230

[stepper_z1]
step_pin: PG4
dir_pin: PC1
enable_pin: !PA0
rotation_distance: 8
microsteps: 16

[stepper_z2]
step_pin: PF9
dir_pin: PF10
enable_pin: !PG2
rotation_distance: 8
microsteps: 16

[extruder]
step_pin: sb2009:PD0
dir_pin: !sb2009:PD1
enable_pin: !sb2009:PD2
rotation_distance: 22.6789511
gear_ratio: 50:10
microsteps: 16
nozzle_diameter: 0.400
filament_diameter: 1.75
heater_pin: sb2009:PB13
sensor_type: Generic 3950
sensor_pin: sb2009:PA3
control: pid
pid_Kp: 22
pid_Ki: 1
pid_Kd: 100
min_temp: 0
max_temp: 270
min_extrude_temp: 170
pressure_advance: 0.04
