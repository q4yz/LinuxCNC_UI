#Start
# =====================================================================
# Example profile: motion sketched, no board chosen yet.
#
# Deliberately declares zero [mcu] sections. A bare pin like
# `step_pin: PF13` needs no `<mcu_id>:` prefix to parse (the parser
# only checks a QUALIFIER against declared MCUs — .agent/component/
# README.md § 1) — so this is a valid Klipper-ish profile and a valid
# hardware.json, but not a compilable machine: nothing routes step/dir
# anywhere without a board. test_halcompiler_validator.py's
# `test_a_profile_without_an_mcu_is_rejected` uses this file to prove
# the E_NO_MCU gate fires on a real profile file rather than only
# on a hand-built test dict. Test fixture only — not a user profile.
# =====================================================================

[machine]
kinematics: cartesian
max_velocity: 300

[stepper_x]
step_pin: PF13
dir_pin: PF12
rotation_distance: 40.0
position_max: 300.0

[estop]
